version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  order-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kometa0707
      POSTGRES_DB: order_db
    ports:
      - "5432:5432"

  payment-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kometa0707
      POSTGRES_DB: payment_db
    ports:
      - "5433:5432"

  payment-service:
    build:
      context: ./paymentService
      dockerfile: Dockerfile
    environment:
      PAYMENT_DB_URL: postgres://postgres:kometa0707@payment-db:5432/payment_db?sslmode=disable
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      GRPC_PORT: "9091"
      HTTP_PORT: "8081"
    ports:
      - "8081:8081"
      - "9091:9091"
    depends_on:
      rabbitmq:
        condition: service_healthy
      payment-db:
        condition: service_started

  order-service:
    build:
      context: ./orderService
      dockerfile: Dockerfile
    environment:
      ORDER_DB_URL: postgres://postgres:kometa0707@order-db:5432/order_db?sslmode=disable
      PAYMENT_GRPC_ADDR: payment-service:9091
      HTTP_PORT: "8080"
      ORDER_GRPC_PORT: "9090"
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      - payment-service
      - order-db

  notification-service:
    build:
      context: ./notificationService
      dockerfile: Dockerfile
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379
    depends_on:
      rabbitmq:
        condition: service_healthy